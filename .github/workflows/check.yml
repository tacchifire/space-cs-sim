# The gate, run by a machine.
#
# READ THIS BEFORE CITING IT. At the time this file was committed nobody had watched GitHub Actions
# execute it. What HAS been run, on a real host, is `tools/ci.sh` - the environment check, its
# self-test, and `make check` end to end in about sixteen minutes. This workflow is a thin caller,
# so the untested part is the plumbing around a verified command, not the gate itself.
#
# Until a run of this file has been observed, the README and CLAUDE.md keep saying that the gate is
# a command a human types. Do not promote that sentence because a YAML file exists; that is the
# failure this project keeps recording, and adding CI is a poor moment to repeat it.
#
# The two jobs are the split design section 9.4 asks for: fetching is allowed to reach the network,
# and the stage that decides pass or fail is not. `probe.sh` downloads prebuilt Zephyr ELFs over
# HTTPS, which is why the design wanted them separated in the first place.

name: check

on:
  push:
    # `main` and the working branch. Until the working branch was listed, GitHub had never
    # registered this workflow at all - the API reported zero workflows and zero runs - because a
    # workflow is registered when it first runs, `push` only matched main, no pull request
    # existed, and `workflow_dispatch` only appears for workflows on the default branch. The file
    # was pushed, reviewed, described in three documents, and inert. "Nobody has watched it run"
    # was true in a stronger sense than intended: there was nothing to watch.
    branches: [main, evidence-gates-and-adcs]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# CI pins the build directory instead of taking the per-checkout default. The default exists
# because two working copies on one machine used to share /tmp/cuberange and overwrite each
# other's firmware (src/cuberange/paths.py); a runner has exactly one checkout, so a fixed path
# costs nothing and lets the artifact globs below name it through this one variable rather than
# spelling it out four more times.
env:
  OUT: /tmp/cuberange-ci

jobs:
  artifacts:
    name: fetch and build (network allowed)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: apt prerequisites
        run: |
          sudo apt-get update
          # bc is not optional: probe.sh's arithmetic is six calls to it. libicu and OpenSSL 3 are
          # dlopened by the .NET runtime Renode ships with, and a C compiler is needed because the
          # codec suite is built natively.
          # bubblewrap: every Renode launch runs inside a loopback-only network namespace
          # (src/cuberange/safety). Without a working backend the gate refuses to
          # start, which is the intended behaviour and would fail this job.
          sudo apt-get install -y bc build-essential python3-dev libicu-dev libssl3 bubblewrap

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # Zephyr v4.1.0's floor is 3.10; 3.12 is tested here

      - name: python dependencies
        run: # west is installed here, not by setup-toolchain.sh, because that script only runs on a
          # cache MISS. The cache holds ~/zephyrproject and ~/zephyr-sdk - the artifacts - and not
          # the tool that drives them, which pip puts in the Python environment. Run 1 had a cold
          # cache, installed west and built every image; run 2 restored the cache, skipped the
          # installer, and failed at `west build` with the toolchain sitting right there. A cache
          # that restores the inputs and not the tool is worse than no cache: it only fails the
          # second time.
          pip install -r requirements.txt cmake ninja west

      # Renode's URL convention embeds the artifact size and SHA1, so the URL is itself the
      # integrity pin - Renode refuses a download whose size or hash does not match.
      - name: cache Renode
        id: renode-cache
        uses: actions/cache@v4
        with:
          path: ~/tools
          key: renode-1.16.1-dotnet-portable

      - name: fetch Renode 1.16.1
        if: steps.renode-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/renode.tar.gz \
            https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable-dotnet.tar.gz
          mkdir -p ~/tools && tar xzf /tmp/renode.tar.gz -C ~/tools

      # About 6.5 GB between the workspace and the SDK, so caching it is the difference between a
      # workflow people run and one they turn off.
      - name: cache the Zephyr toolchain
        id: zephyr-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/zephyrproject
            ~/zephyr-sdk
            ~/libcsp
            ~/cuberange-env.sh
          key: zephyr-v4.1.0-sdk-v1.0.1-libcsp-v2.1

      - name: install the Zephyr toolchain
        if: steps.zephyr-cache.outputs.cache-hit != 'true'
        run: |
          ./tools/setup-toolchain.sh
          git clone --depth 1 --branch v2.1 https://github.com/libcsp/libcsp ~/libcsp


      # A cache of artifacts cannot restore an environment, and this is the third time that has
      # bitten. setup-toolchain.sh installs west AND Zephyr's own Python requirements
      # (pyelftools, pykwalify, and the rest of zephyr/scripts/requirements.txt) with pip, into
      # the interpreter - not into ~/zephyrproject, which is what actions/cache holds. And the
      # installer only runs on a cache MISS.
      #
      # Run 1 (cold) installed everything and built. Run 2 (warm) skipped the installer and died
      # at `west build`. I fixed west, and run 5 died at `west build` again 24 seconds in,
      # because west was only the first of the packages that live in the interpreter.
      #
      # So: cache the downloads, install the environment every time. This step needs the
      # workspace to exist, so it runs after the cache restore and after the conditional install.
      - name: python packages the cache cannot hold
        run: pip install -r "$HOME/zephyrproject/zephyr/scripts/requirements.txt"

      - name: build every node image
        run: |
          export PATH="$HOME/zephyr-sdk/sysroots/x86_64-pokysdk-linux/usr/bin:$PATH"
          make firmware-all firmware-sat1

      - name: upload the images
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: ${{ env.OUT }}/build-*/zephyr/zephyr.elf
          retention-days: 3
          # An empty firmware artifact means the build step produced nothing, which
          # is a failure and not a detail. The default here only warns.
          if-no-files-found: error

  gate:
    name: make check (no egress)
    needs: artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: apt prerequisites
        run: |
          sudo apt-get update
          # bubblewrap: every Renode launch runs inside a loopback-only network namespace
          # (src/cuberange/safety). Without a working backend the gate refuses to
          # start, which is the intended behaviour and would fail this job.
          sudo apt-get install -y bc build-essential python3-dev libicu-dev libssl3 bubblewrap

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: # west is installed here, not by setup-toolchain.sh, because that script only runs on a
          # cache MISS. The cache holds ~/zephyrproject and ~/zephyr-sdk - the artifacts - and not
          # the tool that drives them, which pip puts in the Python environment. Run 1 had a cold
          # cache, installed west and built every image; run 2 restored the cache, skipped the
          # installer, and failed at `west build` with the toolchain sitting right there. A cache
          # that restores the inputs and not the tool is worse than no cache: it only fails the
          # second time.
          pip install -r requirements.txt cmake ninja west

      - uses: actions/cache@v4
        with:
          path: ~/tools
          key: renode-1.16.1-dotnet-portable

      - uses: actions/cache@v4
        with:
          path: |
            ~/zephyrproject
            ~/zephyr-sdk
            ~/libcsp
            ~/cuberange-env.sh
          key: zephyr-v4.1.0-sdk-v1.0.1-libcsp-v2.1

# A cache of artifacts cannot restore an environment, and this is the third time that has
      # bitten. setup-toolchain.sh installs west AND Zephyr's own Python requirements
      # (pyelftools, pykwalify, and the rest of zephyr/scripts/requirements.txt) with pip, into
      # the interpreter - not into ~/zephyrproject, which is what actions/cache holds. And the
      # installer only runs on a cache MISS.
      #
      # Run 1 (cold) installed everything and built. Run 2 (warm) skipped the installer and died
      # at `west build`. I fixed west, and run 5 died at `west build` again 24 seconds in,
      # because west was only the first of the packages that live in the interpreter.
      #
      # So: cache the downloads, install the environment every time. This step needs the
      # workspace to exist, so it runs after the cache restore and after the conditional install.
      - name: python packages the cache cannot hold
        run: pip install -r "$HOME/zephyrproject/zephyr/scripts/requirements.txt"

      # probe.sh --offline refuses to start on a cold artifact cache rather than fetching and
      # reporting success, which is what it used to do (design section 16, W24). That refusal is
      # the thing making this job's "no egress" claim mean something.
      - name: prime Renode's artifact cache
        run: ./tools/renode-probe/probe.sh --fetch-only

      # Unprivileged user namespaces, which bwrap and unshare both need. Ubuntu 24.04 ships
      # kernel.apparmor_restrict_unprivileged_userns=1 and that is why `unshare` fails on the
      # development machine this was written on - there, without root, nothing can be done about
      # it. A runner has sudo and is torn down after the job, so here it can simply be turned off.
      # `|| true`: on an image where the knob does not exist, the probes below say so instead.
      - name: allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sysctl kernel.apparmor_restrict_unprivileged_userns || true

      # One step per backend, each of which FAILS when its backend does not work.
      #
      # The first version of this was a single informational step that printed the probe and
      # always exited 0. It reported success on a run whose gate then died in under a second, and
      # said nothing about why - job logs need a token even on a public repository, so a step's
      # own conclusion is the only thing an unauthenticated reader can see. A step that cannot
      # fail is not evidence here either.
      #
      # continue-on-error, because the useful outcome is knowing which backends work, not stopping
      # at the first that does not.
      - name: 'backend: bwrap'
        continue-on-error: true
        run: PYTHONPATH=src python3 -m cuberange.safety.isolate --probe | grep -q '^  OK   bwrap'

      - name: 'backend: unshare'
        continue-on-error: true
        run: PYTHONPATH=src python3 -m cuberange.safety.isolate --probe | grep -q '^  OK   unshare'

      - name: isolation probe, in full
        run: PYTHONPATH=src python3 -m cuberange.safety.isolate --probe

      # Split from the gate so a public reader can tell an unusable environment from a failing
      # test. The previous run failed "the gate" in zero seconds, which is the environment check
      # refusing - but nothing outside the log said so.
      - name: environment check
        run: |
          export PATH="$HOME/zephyr-sdk/sysroots/x86_64-pokysdk-linux/usr/bin:$PATH"
          ./tools/ci.sh --env-only

      # TEMPORARY, and delete both once they have answered.
      #
      # Run 4 reached `make check` and failed 162 seconds in - which is where `make probe` runs,
      # and the probe asserts a 4-node speed floor of 1.5x real time. That floor is a statement
      # about the HOST: this development machine measures 4.3-5.1x on eight cores, and a two-vCPU
      # runner is a different class of machine entirely. probe.sh's own comment anticipates it
      # ("fail for host reasons rather than regression. Override with PERF_FLOOR=<n>").
      #
      # Guessing a floor for a runner would be putting a number in without measuring it, so
      # instead: run the probe twice, once as configured and once with the floor removed, and let
      # the two step conclusions say which it was. If the first fails and the second passes it is
      # the floor; if both fail it is something else; if both pass the gate's failure is
      # downstream of the probe. Job logs need a token even here, so a step's conclusion is the
      # only thing that reaches an unauthenticated reader.
      - name: 'probe: as configured'
        continue-on-error: true
        run: |
          export PATH="$HOME/zephyr-sdk/sysroots/x86_64-pokysdk-linux/usr/bin:$PATH"
          make probe

      - name: 'probe: with the speed floor removed'
        continue-on-error: true
        run: |
          export PATH="$HOME/zephyr-sdk/sysroots/x86_64-pokysdk-linux/usr/bin:$PATH"
          PERF_FLOOR=0 make probe

      - name: the gate
        run: |
          export PATH="$HOME/zephyr-sdk/sysroots/x86_64-pokysdk-linux/usr/bin:$PATH"
          ./tools/ci.sh

      - name: keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            ${{ env.OUT }}/*.uart
            ${{ env.OUT }}/*renode.log
            /tmp/cuberange-probe*/
          retention-days: 7
          if-no-files-found: ignore
