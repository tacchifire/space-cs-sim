CONFIG_LIBCSP=y
CONFIG_CSP_USE_RTABLE=n
CONFIG_CSP_HAVE_CAN=y

CONFIG_PICOLIBC=y
CONFIG_CAN=y
CONFIG_EVENTS=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Keep the console quiet and on usart3. The space link will live on a different UART; see the
# design's UART assignment section. Logging is off so the console carries only our own printk.
CONFIG_LOG=n
CONFIG_BOOT_BANNER=y
