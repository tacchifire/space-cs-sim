# What verifying a telecommand's own MAC costs, in config.
#
# Applied through EXTRA_CONF_FILE by the EX-S02 builds only, for the same reason crosslink.conf is:
# every other exercise's COMM keeps the Kconfig output it has, and those exercises rest on pairs
# that compare Kconfig outputs.
#
# mbedTLS rather than PSA. Both are available; mbedtls_gcm_auth_decrypt is one call with no key
# store, no handle lifecycle and no key-policy vocabulary, and this range has exactly one key,
# written down in a public repository. A PSA key slot would be ceremony around a constant.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y

# STACKS, and this is the interesting line in the file.
#
# sizeof(mbedtls_gcm_context) is 424 octets - measured - and Zephyr's default main stack is 1024.
# W47 is what happens when that is not accounted for: a node that boots, prints, passes its own
# crypto self-test and then silently stops receiving, because the overflow corrupted a kernel
# object rather than faulting. Here the context lives on the OBC's app thread rather than main,
# and both are raised; HW_STACK_PROTECTION is on so the next one is loud instead.
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_HW_STACK_PROTECTION=y
