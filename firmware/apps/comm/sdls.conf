# What SDLS verification costs, in config.
#
# Applied through EXTRA_CONF_FILE by the SDLS builds only, for the same reason crosslink.conf is:
# every other exercise's COMM keeps the Kconfig output it has, and those exercises rest on pairs
# that compare Kconfig outputs.
#
# mbedTLS rather than PSA. Both are available; mbedtls_gcm_auth_decrypt is one call with no key
# store, no handle lifecycle and no key-policy vocabulary, and this range has exactly one key,
# written down in a public repository. A PSA key slot would be ceremony around a constant.
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y

# STACKS, and this is the interesting line in the file.
#
# sizeof(mbedtls_gcm_context) is 424 octets - measured - and Zephyr's default main stack is 1024.
# COMM's main() already spends most of that on csp_init and two CAN interface registrations, so
# the boot self-test's context overflowed it. What that corrupted was whichever kernel object sat
# below, and the symptom was a COMM that booted, printed, PASSED its own crypto self-test, ran
# link_task, and then never received a single octet on the space link. No fault, no log line, no
# counter - four measured hypotheses died before this one (the mbedTLS heap, HW_STACK_PROTECTION,
# link_task's own stack, and the SDLS framing itself, each ruled out by a build that still failed).
#
# HW_STACK_PROTECTION is here so the next one is loud. It was NOT on when this happened.
CONFIG_MAIN_STACK_SIZE=3072
CONFIG_HW_STACK_PROTECTION=y
