CONFIG_LIBCSP=y
CONFIG_CSP_USE_RTABLE=n
CONFIG_CSP_HAVE_CAN=y

CONFIG_PICOLIBC=y
CONFIG_CAN=y
CONFIG_EVENTS=y
CONFIG_HEAP_MEM_POOL_SIZE=4096

CONFIG_SERIAL=y
