# CubeRange: what a second CSP interface costs, in config.
#
# Applied through EXTRA_CONF_FILE by the crosslink builds only, alongside crosslink.overlay, so
# that every existing exercise's COMM keeps the Kconfig output it has. The vuln/hardened pairs
# those exercises rest on are checked by comparing Kconfig outputs; a change here would change
# both halves of several pairs at once.

# libcsp's Zephyr CAN driver hands each interface a thread stack out of a fixed array sized by
# this, and refuses the interface when the array is used up:
#
#     if (rx_thread_idx >= CONFIG_CSP_CAN_RX_THREAD_NUM) { ... }   can_zephyr.c:156
#
# The default is 1. Without this line the crosslink's csp_can_open_and_add_interface returns an
# error and COMM prints FATAL and stops - loudly, which is the right failure, but it is a failure.
CONFIG_CSP_CAN_RX_THREAD_NUM=2

# Each interface context is k_calloc'd from the system heap, and most of it is the RX message
# queue: CSP_CAN_RX_MSGQ_DEPTH is 64 and a struct can_frame is around 20 octets here (CAN_MAX_DLEN
# is 8 because CONFIG_CAN_FD_MODE is off), so roughly 1.3 KiB of queue plus the thread control
# block and the csp_iface_t - call it 1.6 KiB per interface. 4096 held one. Two need more.
#
# If this is still too small the symptom is not subtle: k_calloc returns NULL and COMM prints
# FATAL. It is set with headroom rather than to the computed minimum because the computed minimum
# is an estimate of somebody else's struct.
CONFIG_HEAP_MEM_POOL_SIZE=8192
